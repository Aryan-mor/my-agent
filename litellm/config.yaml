# LiteLLM proxy for OpenCode: free provider chain with instant failover on 429 / errors.
#   Kilo -> OpenRouter -> Gemini -> NVIDIA NIM -> GLM bridge -> local Ollama (last, optional)
# Do NOT run this file directly: start-litellm.ps1 renders it into config.generated.yaml,
# filling the local model from .env (MYAGENT_LOCAL_MODEL / MYAGENT_LOCAL_URL) when MYAGENT_LOCAL=on,
# and removing the whole ollama-local block + its fallback entries when MYAGENT_LOCAL=off.
# Providers whose key is missing simply fail and are skipped by the fallback chain.
model_list:
  # ---- primary groups used by OpenCode (auto/sonnet, auto/opus)
  - model_name: sonnet
    litellm_params:
      model: openai/kilo-auto/free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_API_KEY
      max_retries: 0
      stream_timeout: 90
      timeout: 90
  - model_name: opus
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      max_retries: 0
      stream_timeout: 90
      timeout: 90
  # ---- free fallback groups
  - model_name: kilo-free
    litellm_params:
      model: openai/kilo-auto/free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_API_KEY
      max_retries: 0
      stream_timeout: 90
      timeout: 90
  - model_name: openrouter-nemotron
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      max_retries: 0
      stream_timeout: 90
      timeout: 90
  - model_name: openrouter-free
    litellm_params:
      model: openai/openrouter/free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      max_retries: 0
      stream_timeout: 90
      timeout: 90
  # Google Gemini via the native gemini/ provider (handles Gemini thought_signature on tool-call history).
  # NOTE: the key is read from OPENAI_API_KEY (kept for compatibility); put your Google AI Studio key there.
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/OPENAI_API_KEY
      max_retries: 0
      stream_timeout: 90
      timeout: 90
  - model_name: nvidia-nemotron
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_retries: 0
      stream_timeout: 60
      timeout: 90
  - model_name: nvidia-glm
    litellm_params:
      model: openai/z-ai/glm-5.3
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_retries: 0
      stream_timeout: 40
      timeout: 90
  # optional local OpenAI-compatible GLM bridge on :3001 (started by agent.ps1 only when GLM_BRIDGE_DIR is set)
  - model_name: glm
    litellm_params:
      model: openai/glm-5.3
      api_base: http://127.0.0.1:3001/v1
      api_key: os.environ/GLM_API_KEY
      max_retries: 0
      stream_timeout: 90
      timeout: 90
  # >>> ollama-local (generated from .env; removed when MYAGENT_LOCAL=off)
  - model_name: ollama-local
    litellm_params:
      model: openai/__MYAGENT_LOCAL_MODEL__
      api_base: __MYAGENT_LOCAL_URL__
      api_key: ollama
      max_retries: 0
      stream_timeout: 300
      timeout: 300
  # <<< ollama-local

litellm_settings:
  drop_params: true
  num_retries: 0
  request_timeout: 600
  max_fallbacks: 10
  # fallbacks also apply to 429 RateLimitError (no waiting on Retry-After). Keep flow style: the
  # start script removes `, "ollama-local"` from these lines when the local model is off.
  fallbacks:
    - sonnet: ["openrouter-nemotron", "gemini-flash", "nvidia-nemotron", "openrouter-free", "glm", "ollama-local"]
    - opus: ["nvidia-glm", "gemini-flash", "kilo-free", "openrouter-free", "glm", "ollama-local"]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0          # no retry on primary -> go straight to fallback
  retry_after: 0
  allowed_fails: 1        # 1 failure (e.g. 429) -> deployment cooled down
  cooldown_time: 20       # short cooldown so a burst of errors does not block every model for a minute
  disable_cooldowns: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY